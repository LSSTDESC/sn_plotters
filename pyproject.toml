[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sn_plotters"
version="1.1.0"
requires-python = ">=3.5"
dependencies = ['matplotlib','numpy']
authors = [
  {name = "Philippe Gris", email = "philippe.gris@clermont.in2p3.fr"},
]
maintainers = [
  {name = "Philippe Gris", email = "philippe.gris@clermont.in2p3.fr"}
]
description = "Scheduler tools"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["Programming Language :: Python",]

[tool.setuptools.packages.find]
where = ["."]
include = ['sn_plotter_simu', 'sn_plotter_fitlc','sn_plotter_metrics',
	           'sn_plotter_analysis','sn_plotter_cosmology',
		   'sn_plotter_scheduler','sn_plotter_flux_pixels', 'sn_plotter_os_info']

[project.urls]
Homepage = "http://github.com/lsstdesc/sn_plotters"
Repository = "https://github.com/lsstdesc/sn_plotters"